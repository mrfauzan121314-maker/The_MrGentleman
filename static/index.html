<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MrGentleman</title>
<style>
  :root {
    --paper: #f5ecd9;
    --paper-deep: #e9dcc1;
    --ink: #2c2117;
    --ink-soft: #6c5a45;
    --rule: #cbb795;
    --accent: #6d4b26;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 20% 10%, #fbf5e6 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #efe1c4 0%, transparent 40%),
      var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: min(760px, 100%);
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: 1px solid var(--rule);
    background: rgba(255, 252, 244, .72);
    box-shadow: 0 18px 40px -28px rgba(60, 40, 20, .55);
  }
  header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--rule);
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1::after {
    content: "";
    display: block;
    width: 54px;
    height: 1px;
    margin: 10px auto 0;
    background: var(--rule);
  }
  .mode {
    margin: 8px 0 0;
    font-size: .78rem;
    font-style: italic;
    color: var(--ink-soft);
    letter-spacing: .02em;
  }
  .log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .turn {
    max-width: 86%;
    line-height: 1.48;
    font-size: 1.02rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .who {
    display: block;
    margin-bottom: 4px;
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .gentleman {
    align-self: flex-start;
    padding: 12px 15px;
    background: #fffdf6;
    border: 1px solid var(--rule);
  }
  .gentleman .who { color: var(--accent); }
  .visitor {
    align-self: flex-end;
    padding: 12px 15px;
    background: var(--paper-deep);
    border: 1px solid #d6c3a3;
    text-align: right;
  }
  .error { color: #8a2f1d; font-style: italic; }
  .pending::after {
    content: "…";
    animation: breathe 1.1s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--rule);
    background: rgba(255, 252, 244, .8);
  }
  input {
    flex: 1;
    padding: 11px 13px;
    font: inherit;
    font-size: .98rem;
    color: var(--ink);
    background: #fffdf6;
    border: 1px solid var(--rule);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #a2917a; font-style: italic; }
  button {
    padding: 11px 20px;
    font: inherit;
    font-size: .92rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #fffaf0;
    background: var(--accent);
    border: 1px solid var(--accent);
    cursor: pointer;
  }
  button:hover { background: #7d5a31; }
  button:disabled { opacity: .5; cursor: default; }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #211b14;
      --paper-deep: #2e261c;
      --ink: #ece2cf;
      --ink-soft: #b3a08a;
      --rule: #4a3d2c;
      --accent: #d7b57f;
    }
    body {
      background:
        radial-gradient(circle at 20% 10%, #2b2318 0%, transparent 45%),
        radial-gradient(circle at 85% 90%, #261f16 0%, transparent 40%),
        var(--paper);
    }
    main, form { background: rgba(38, 31, 22, .7); }
    .gentleman { background: #2b2318; }
    .visitor { background: #332a1f; border-color: #45392a; }
    input { background: #2b2318; color: var(--ink); }
    button { color: #1d1710; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>MrGentleman</h1>
    <p class="mode" id="mode">prithee, a moment…</p>
  </header>

  <div class="log" id="log" aria-live="polite" aria-label="Conversation"></div>

  <form id="say" autocomplete="off">
    <input id="input" name="message" placeholder="Speak thy mind…" required
           aria-label="Thy words" maxlength="2000">
    <button id="send" type="submit">Speak</button>
  </form>
</main>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('say');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const mode = document.getElementById('mode');

  function turn(who, text) {
    const bubble = document.createElement('div');
    bubble.className = 'turn ' + who;
    const label = document.createElement('span');
    label.className = 'who';
    label.textContent = who === 'visitor' ? 'Thou' : 'MrGentleman';
    bubble.append(label, document.createTextNode(text));
    log.append(bubble);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  async function greet() {
    try {
      const res = await fetch('/hello', { headers: { 'Accept': 'application/json' } });
      const data = await res.json();
      mode.textContent = data.mode;
      turn('gentleman', data.greeting);
    } catch (err) {
      mode.textContent = 'the parlour is quiet';
      turn('gentleman', 'Alack! I cannot hear thee. Is the server yet running?');
    }
  }

  async function speak(words, bubble) {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: words })
    });
    if (!res.ok || !res.body) {
      let why = 'the parlour would not answer';
      try { why = (await res.json()).error || why; } catch (e) {}
      throw new Error(why);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const text = bubble.lastChild;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split('\n\n');
      buffer = events.pop();

      for (const block of events) {
        const line = block.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        let event;
        try { event = JSON.parse(payload); } catch (e) { continue; }

        if (event.error) {
          text.textContent = event.error;
          bubble.classList.add('error');
        } else if (event.delta) {
          text.textContent += event.delta;
          log.scrollTop = log.scrollHeight;
        }
      }
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const words = input.value.trim();
    if (!words) return;

    input.value = '';
    turn('visitor', words);
    const bubble = turn('gentleman', '');
    bubble.classList.add('pending');
    send.disabled = true;
    input.disabled = true;

    try {
      await speak(words, bubble);
    } catch (err) {
      bubble.lastChild.textContent = 'Alack! Mine oracle is indisposed -- ' + err.message + '.';
      bubble.classList.add('error');
    } finally {
      bubble.classList.remove('pending');
      send.disabled = false;
      input.disabled = false;
      input.focus();
    }
  });

  greet();
  input.focus();
</script>
</body>
</html>
